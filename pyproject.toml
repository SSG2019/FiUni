[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiunilib"
version = "0.1.0"
description = "FiUni: Fisher-based unified continual learning toolkit."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0.0",
  "torchvision>=0.20.1",
  "pyvene==0.1.1",
  "transformers==4.48.2",
  "protobuf==3.20.0",
  "matplotlib==3.7.4",
  "ipywidgets==8.1.1",
  "plotnine==0.12.4",
  "huggingface-hub",
  "numpy==1.26.4",
  "accelerate==0.29.1",
  "sentencepiece==0.1.96",
  "evaluate==0.4.1",
  "datasets==2.18.0",
  "wandb",
  "scikit-learn",
  "jupyter",
  "fsspec==2024.2.0",
  "ydata-profiling==4.7.0",
  "seaborn==0.12.2",
  "gcsfs==2024.2.0",
  "modelscope",
  "matplotlib==3.10.3"
]

[tool.setuptools]
packages = ["fiunilib"]
